name: Canvas HTML CUJ
on:
  push:
    paths: ['canvas-demo/**', '.github/workflows/canvas-html-cuj.yml']
  pull_request:
    paths: ['canvas-demo/**', '.github/workflows/canvas-html-cuj.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: canvas-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: canvas-demo/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm test
      - name: Linux desktop CUJ
        if: runner.os == 'Linux'
        env:
          CANVAS_E2E_NO_SANDBOX: '1'
        run: xvfb-run -a npm run test:desktop
      - name: Native desktop CUJ
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-html-${{ matrix.os }}
          path: canvas-demo/test-results/
          if-no-files-found: ignore
